schema_version = 1
purpose = "Machine-consumed current/target ownership registry for behaviorally sensitive concepts"

# The migration is finished (2026-08-21). current_phase is NOT active
# migration-stage tracking -- it is the reference phase number
# docs/migration/tools/migration_integrity.py's bridge_errors() compares
# every docs/migration/BRIDGES.md [[bridge]] entry's removal_gate
# against, to catch a bridge accidentally left un-retired. Every bridge
# with a PHASE_N gate (B1/B2=PHASE_7, B3=PHASE_8) is already
# status="removed" with empty locations; only B4 (removal_gate="NEVER",
# phase-number-independent) remains genuinely active. No value >= 8
# changes that check's outcome today -- kept at its real historical
# value rather than bumped further, since bumping it would falsely
# imply an ongoing phase sequence that no longer exists.
current_phase = 14

# [rules.R7b] (retired): it policed a top-level legacy/ historical-
# compatibility subtree (legacy/manifest_compat.py) restricted to
# archives/, legacy/, research/, and simulator/schema.py importers. A
# later audit found legacy/manifest_compat.py held only ~40 lines of
# absence-driven warning/provenance-normalization functions -- none of
# the G7 frozen dataclasses that actually cannot move -- and
# simulator/schema.py was already its only current importer. The
# module was folded into simulator/legacy_manifest_compat.py (its sole
# consumer's own ownership) and the legacy/ package deleted, so the
# rule's package boundary no longer exists to police. The real,
# still-load-bearing old-archive-manifest behavior itself is
# unchanged; see tests/test_archive_schema_legacy_compat.py.

[repository]
python_roots = ["."]

[[concept]]
id = "tower_map_profiles"
rule = "R7a"
symbols = ["TowerMapProfile", "LIVE_TOWER_PROFILE", "SIM_TOWER_PROFILE"]
current_owners = [
  "farming/map_profile.py",
]
target_owner = "farming/map_profile.py"
status = "green-canonical-named-consumer-profiles"
accepted_baseline_violation = false
minimum_owners = 1

