schema_version = 1
current_phase = 3
strategy = "C -> A, defer B"
purpose = "Machine-consumed current/target ownership registry for behaviorally sensitive concepts"

[repository]
python_roots = [
  "foreground_vision_bot",
  "flyff_farming_simulator",
  "flyff_farming_recorder",
  ".",
]

[rules.R7b]
status = "active-ratcheted-current-layout"
legacy_path_segments = ["legacy", "archives", "_quarantine"]
allowed_importer_prefixes = ["archives/", "legacy/", "research/"]
activation_note = "Future physical legacy/archive/research boundaries do not yet all exist; exact current violations are frozen and growth fails."

[[concept]]
id = "observation_schema_id"
rule = "R6"
symbols = ["OBSERVATION_SCHEMA_ID"]
current_owners = [
  "flyff_farming_recorder/recorder/session.py",
  "flyff_farming_simulator/farming/observation.py",
  "foreground_vision_bot/farming/observation.py",
]
target_owner = "shared farming pure core; physical path deferred until Phase 4"
status = "accepted-pre-consolidation-debt"
accepted_baseline_violation = true
minimum_owners = 1
permitted_bridge = "B1 when installed in a later phase"
resolution_phase = "PHASE_4"

