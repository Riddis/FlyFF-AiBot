name_resolution = "No symbol literally named PHYSICS_VERSION exists; MOVEMENT_PHYSICS_MODEL_ID is the authoritative physics-model version tag in movement_kernel.py."

[g4.legacy_physics_version]
value = "legacy_recorded_iid"
kind = "string"
symbol = "LEGACY_MOVEMENT_PHYSICS_MODEL_ID"
owners = ["flyff_farming_simulator/simulator/movement_kernel.py"]

# The calibrated kinematic constants the version tag names. Frozen alongside the
# tag so a silent constant change cannot hide behind an unchanged tag string.
