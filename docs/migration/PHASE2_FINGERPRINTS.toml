# ---------------------------------------------------------------------------
# G4 -- PHYSICS_VERSION
# ---------------------------------------------------------------------------
# The accepted plan calls this "PHYSICS_VERSION" but NO symbol of that name
# exists in source. The authoritative physics-model version tag in the current
# movement_kernel.py is MOVEMENT_PHYSICS_MODEL_ID. Its literal was read from
# source (never taken from the task prompt) and pinned here.

[g4.physics_version]
value = "live_calibrated_arc"
kind = "string"
symbol = "MOVEMENT_PHYSICS_MODEL_ID"
owners = ["flyff_farming_simulator/simulator/movement_kernel.py"]
