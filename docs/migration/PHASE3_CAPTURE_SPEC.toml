comparison_semantics = "exact bytes and exact typed values unless explicitly stated"

[observation]
suite_name = "observation-corpus"
random_count = 10000
edge_case_count = 16
total_count = 10016
source_apis = [
  "foreground_vision_bot/farming/observation.py:ObservationBuilder.build_vector",
  "flyff_farming_simulator/farming/observation.py:ObservationBuilder.build_vector",
]
import_isolation = "separate python -I subprocess for each product root"
input_representation = "complete canonical MessagePack corpus compressed with deterministic gzip"
expected_representation = "per-row SHA-256, aggregate row-byte SHA-256, and rows 0,1,2,15,16,9999,10015 as full sentinels"
required_shape = [923]
required_dtype = "float32"
require_finite = true
cross_implementation_comparison = "numpy.array_equal over every complete vector"
edge_cases = [
  "zero_actors", "one_self_actor", "many_actors", "dead_actors_filtered",
  "eva_axis_exact", "eva_axis_nextbelow", "eva_axis_nextabove",
  "eva_diagonal_exact", "eva_diagonal_nextbelow", "eva_diagonal_nextabove",
  "negative_quadrant_boundary", "translated_bucket_boundary",
  "actor_order_forward", "actor_order_reverse", "blocked_far_actor",
  "normalization_extremes",
]

[neighbour_boundary]
suite_name = "neighbour-boundary"
source_api = "ObservationBuilder._nearby_counts"
radius = 8.0
comparison = "exact integer dictionaries plus exact full vectors"
known_difference = "bot hypot(dx,dy)<=radius versus simulator squared-distance<=radius^2"
case_families = [
  "positive_axes_exact_nextbelow_nextabove",
  "negative_axes_exact_nextbelow_nextabove",
  "diagonals_exact_nextbelow_nextabove",
  "four_quadrants", "bucket_boundaries", "translated_geometry",
  "actor_order_permutations", "self_count", "zero_one_many",
  "deterministic_random_fuzz_4096",
]
classification_rule = "only exact-boundary hypot-vs-squared mismatches are accepted as a documented Phase-4 constraint; broader divergence blocks"

[geodesic]
suite_name = "bounded-geodesic"
source_api = "flyff_farming_simulator/farming/map_features.py:FarmingMapFeatures.bounded_geodesic_field and geodesic_distance"
comparison = "exact Python float equality; unreachable point result is infinity and absent field entry"
case_families = [
  "ordinary_reachable", "unreachable_start", "blocked_start", "blocked_goal",
  "out_of_map", "maximum_distance_exact", "maximum_distance_inside_outside",
  "expansion_limits_1_2_8_32_256", "diagonal_corner_cut",
  "narrow_obstacle", "repeated_cache", "random_safe_512",
]
maps = ["open_17", "corner_cut_17", "narrow_obstacle_25", "disconnected_17"]
tolerance = "none"

[maps]
suite_name = "derived-maps"
g11_precondition = "phase2_fingerprints.py g11 must pass before loading"
live_api = "FarmingMapContext.load(\"Tower AoE\")"
live_obstacle_radius_cells = 2
simulator_api = "MapModel.load()"
simulator_obstacle_radius_cells = 0
teleport_radius_cells = 2
arrays = ["traversable", "forbidden", "safe_traversable"]
metadata = ["source_bounds", "grid_origin", "content_hash"]
array_encoding = "shape/dtype plus numpy.packbits(bitorder=big) base64 and SHA-256 of C-order bool bytes"
cross_loader_equality = "intentionally not required"
map6 = "diagnostic only; cell counts, safe-mask XOR when aligned, source bounds/frame; never a gate or radius-unification authority"

